        :root {

            --dark-gold: #aa820a;
            --bg-color: #faf8f5;
            --text-dark: #2c2c2c;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Amiri', serif;
            margin: 0;
            padding: 30px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
        }

        /* الكارت الرئيسي للعقد بشكل القوس */
        .contract-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 50px 30px 40px 30px;
            box-sizing: border-box;
            border-radius: 250px 250px 20px 20px; /* شكل القوس العلوي */
            border: 3px solid var(--gold);
            outline: 2px solid var(--gold-light);
            outline-offset: -8px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            text-align: center;
            position: relative;
        }
